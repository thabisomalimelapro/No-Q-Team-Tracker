<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No Q · Team workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F4FB; --surface:#FFFFFF; --surface-2:#F2EDF8; --surface-3:#E9E1F3; --ink:#1A0B33; --muted:#6B6285; --faint:#9A93AE; --line:#ECE6F3;
  --brand:#4A0C8B; --brand-soft:#EFE6FA; --brand-ink:#FFFFFF; --accent:#FF7A00; --accent-ink:#1A0B33;
  --nav:#1A0B33; --nav-ink:#F3EDFB; --nav-muted:#B3A6CF; --nav-hover:rgba(255,255,255,.07); --nav-active:rgba(255,255,255,.12);
  --todo:#9A90B2; --doing:#6D28D9; --wait:#E56F00; --done:#1F8A57; --late:#C42B2B;
  --todo-bg:#F0EDF5; --doing-bg:#EFE6FA; --wait-bg:#FFF0E2; --done-bg:#E3F4EA; --late-bg:#FBE7E7;
  --shadow:0 1px 2px rgba(26,11,51,.04), 0 4px 16px rgba(26,11,51,.05);
  --radius:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#110820; --surface:#1A1030; --surface-2:#22163C; --surface-3:#2C1E4A; --ink:#F3EDFB; --muted:#B3A6CF; --faint:#857BA0; --line:#2C2045;
    --brand:#B48AF0; --brand-soft:#2B1B4A; --brand-ink:#110820; --accent:#FF8A1F; --accent-ink:#110820;
    --nav:#0B0516; --nav-ink:#F3EDFB; --nav-muted:#9A8FB5;
    --todo:#9A8FB5; --doing:#B48AF0; --wait:#FF9A3D; --done:#3FC08A; --late:#FF6B6B;
    --todo-bg:#261D38; --doing-bg:#2B1B4A; --wait-bg:#3A2412; --done-bg:#12301F; --late-bg:#3A1616;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#110820; --surface:#1A1030; --surface-2:#22163C; --surface-3:#2C1E4A; --ink:#F3EDFB; --muted:#B3A6CF; --faint:#857BA0; --line:#2C2045;
  --brand:#B48AF0; --brand-soft:#2B1B4A; --brand-ink:#110820; --accent:#FF8A1F; --accent-ink:#110820;
  --nav:#0B0516; --nav-ink:#F3EDFB; --nav-muted:#9A8FB5;
  --todo:#9A8FB5; --doing:#B48AF0; --wait:#FF9A3D; --done:#3FC08A; --late:#FF6B6B;
  --todo-bg:#261D38; --doing-bg:#2B1B4A; --wait-bg:#3A2412; --done-bg:#12301F; --late-bg:#3A1616;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:'Montserrat','DM Sans',Arial,sans-serif;margin:0;letter-spacing:-.2px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--nav) 232px,transparent 232px)}
.nav{background:var(--nav);color:var(--nav-ink);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px}
.mark{width:38px;height:38px;border-radius:11px;background:#4A0C8B;border:3px solid #FF7A00;display:grid;place-items:center;font-family:'Montserrat',Arial,sans-serif;font-weight:800;font-size:14px;color:#fff;letter-spacing:-.5px;flex:none}
.brand b{display:block;font-family:'Montserrat',Arial,sans-serif;font-size:15px}
.brand span{font-size:12.5px;color:var(--nav-muted)}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--nav-muted);padding:10px 12px;border-radius:10px;font-weight:600;text-align:left}
.navbtn:hover{background:var(--nav-hover);color:var(--nav-ink)}
.navbtn[aria-current="page"]{background:var(--nav-active);color:var(--nav-ink)}
.navbtn[aria-current="page"] .ic{color:#FF7A00}
.navbtn .badge{margin-left:auto;background:#FF7A00;color:#1A0B33;border-radius:999px;font-size:11.5px;font-weight:800;padding:1px 7px}
.navfoot{margin-top:auto;padding:10px 12px;font-size:12.5px;color:var(--nav-muted);display:flex;flex-direction:column;gap:4px}
.main{min-width:0}
.page{max-width:1240px;margin:0 auto;padding:30px 32px 80px}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead h1{font-size:26px;font-weight:800}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.pagehead .acts{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}

/* ---------- controls ---------- */
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;min-height:40px;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-soft{background:var(--brand-soft);color:var(--ink)}
.btn-soft:hover{background:var(--surface-3)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:transparent;border:1px solid var(--late);color:var(--late)}
.btn-sm{min-height:32px;padding:5px 12px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
.iconbtn{background:transparent;border:0;border-radius:8px;width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.toolbar .grow{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 14px;font-weight:600;font-size:14px;color:var(--muted);min-height:32px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ctl{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:40px}
.search{min-width:200px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--brand)}

/* ---------- cards & tiles ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 20px 8px}
.card-h h2{font-size:15.5px;font-weight:700}
.card-h .count{color:var(--faint);font-size:14px;font-weight:600}
.card-h .more{margin-left:auto;background:none;border:0;color:var(--brand);font-weight:600;font-size:13.5px;padding:4px 6px;border-radius:6px}
.card-h .more:hover{background:var(--brand-soft)}
.card-b{padding:6px 20px 18px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.tile{padding:18px 20px;display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);width:100%}
button.tile:hover{border-color:var(--brand)}
.tile .lbl{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.tile .val{font-family:'Montserrat',Arial,sans-serif;font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-.5px}
.tile .val.small{font-size:18px;line-height:1.3;letter-spacing:0}
.tile .sub{font-size:13px;color:var(--muted)}
.tile .sub.warn{color:var(--late);font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
.grid2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:20px}
.greet{font-size:15px;color:var(--muted);margin:0 0 18px}
.greet b{color:var(--ink)}

/* ---------- rows ---------- */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.rows .row:first-child{border-top:0}
button.row:hover .t{color:var(--brand)}
.row .t{font-weight:600;line-height:1.35}
.row .m{font-size:13px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .r{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;white-space:nowrap}
.sdot{width:10px;height:10px;border-radius:50%;flex:none}
.empty{color:var(--muted);font-size:14px;padding:10px 0 4px}
.sep{color:var(--faint)}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--ink)}
.pill.todo{background:var(--todo-bg)} .pill.doing{background:var(--doing-bg)} .pill.wait{background:var(--wait-bg)} .pill.done{background:var(--done-bg)} .pill.late{background:var(--late-bg)}
.pill.plain{background:var(--surface-2)}
.due{font-weight:600}
.due.late{color:var(--late)} .due.soon{color:var(--wait)}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;background:var(--brand-soft);color:var(--ink);flex:none;letter-spacing:.2px}
.av.lg{width:48px;height:48px;font-size:16px}
.avs{display:inline-flex}
.avs .av{border:2px solid var(--surface);margin-left:-5px}
.avs .av:first-child{margin-left:0}

/* progress */
.wsrow{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:6px 14px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rows .wsrow:first-child{border-top:0}
.wsrow .nm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.wsrow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsrow .st{font-size:13px;color:var(--muted);text-align:right}
.bar{grid-column:1/-1;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* ---------- tasks ---------- */
.group{margin-bottom:16px}
.group-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:10px 4px;text-align:left}
.group-h h2{font-size:15px;font-weight:700}
.group-h .count{color:var(--faint);font-weight:600;font-size:14px}
.group-h .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.group-h[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.tlist{padding:4px 18px}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.tlist .trow:first-child{border-top:0}
.trow:hover .t{color:var(--brand)}
.trow .t{font-weight:600}
.trow .m{font-size:13px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.trow .meta{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);white-space:nowrap}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:10px}
.board.six{grid-template-columns:repeat(6,minmax(220px,1fr))}
.col{background:var(--surface-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px;border:2px solid transparent}
.col.drop{border-color:var(--accent)}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 6px}
.col-h h2{font-size:14px;font-weight:700}
.col-h .count{margin-left:auto;color:var(--muted);font-size:13px;font-weight:600}
.col-h .sum{display:block;width:100%;font-size:12.5px;color:var(--muted);font-weight:600}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.kcard:hover{border-color:var(--brand)}
.kcard .tag{font-size:12px;color:var(--muted);font-weight:600}
.kcard .t{font-weight:600;line-height:1.35}
.kcard .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.kcard .val{font-family:'Montserrat',Arial,sans-serif;font-weight:700;color:var(--ink)}

/* ---------- meetings ---------- */
.mrow{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.rows .mrow:first-child{border-top:0}
.datebox{width:62px;border-radius:12px;background:var(--brand-soft);text-align:center;padding:6px 0;line-height:1.1}
.datebox b{display:block;font-family:'Montserrat',Arial,sans-serif;font-size:22px}
.datebox span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase}
.datebox.today{background:var(--accent);color:var(--accent-ink)}
.datebox.today span{color:var(--accent-ink)}
.mrow .t{font-weight:700;background:none;border:0;padding:0;text-align:left}
.mrow .t:hover{color:var(--brand)}
.mrow .m{font-size:13px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mrow .acts{display:flex;gap:8px}

/* ---------- pipeline charts ---------- */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:12px;font-family:'DM Sans',Arial,sans-serif}
.chart .axis{stroke:var(--line)}
.funnel{display:flex;flex-direction:column;gap:10px}
.frow{display:grid;grid-template-columns:110px minmax(0,1fr) 120px;gap:12px;align-items:center;font-size:13.5px}
.frow .lb{font-weight:600}
.frow .track{height:26px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.frow .fill{height:100%;border-radius:8px;min-width:4px}
.frow .vl{text-align:right;color:var(--muted)}
.frow .vl b{color:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:860px}
th{font-size:12.5px;color:var(--muted);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- team ---------- */
.dept{margin-bottom:22px}
.dept h2{font-size:15px;font-weight:700;margin:0 0 10px;display:flex;gap:10px;align-items:baseline}
.dept h2 span{color:var(--faint);font-weight:600;font-size:13.5px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.person{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:16px;text-align:left;width:100%}
button.person:hover{border-color:var(--brand)}
.person .nm{font-weight:700;line-height:1.3}
.person .rl{font-size:13.5px;color:var(--muted);margin-top:2px}
.person .st{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.person.vacant{border-style:dashed;box-shadow:none;background:transparent}
.person.vacant .av{background:transparent;border:2px dashed var(--line);color:var(--faint)}

/* ---------- settings ---------- */
.swatch{width:16px;height:16px;border-radius:5px;flex:none}
.wsedit{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rows .wsedit:first-child{border-top:0}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:8px;border:2px solid transparent;padding:0}
.colors button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}

/* ---------- dialog ---------- */
dialog{border:0;border-radius:18px;padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--surface);color:var(--ink);box-shadow:0 24px 80px rgba(0,0,0,.35)}
dialog.wide{width:min(900px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(17,8,32,.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.dlg-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:18px}
.dlg-tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line)}
.dlg-tabs button{border:0;background:transparent;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.dlg-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.dlg-b{padding:18px 20px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;align-content:start}
.dlg-f{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);align-items:center}
.dlg-f .grow{flex:1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field>label,.field>.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.field .hint{font-size:12.5px;color:var(--faint)}
.field input:not([type=checkbox]),.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;min-height:40px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.field textarea.tall{min-height:180px}
.sseg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sseg.six{grid-template-columns:repeat(6,1fr)}
.sseg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 4px;font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
.sseg button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13.5px;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.daytog{display:flex;gap:6px}
.daytog button{width:42px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:700;color:var(--muted);padding:0;display:grid;place-items:center}
.daytog button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daytog button.is-today{box-shadow:inset 0 0 0 2px var(--brand)}
.log{display:flex;flex-direction:column;gap:10px}
.logitem{border-left:3px solid var(--line);padding:2px 0 2px 12px}
.logitem .when{font-size:12.5px;color:var(--muted)}
.logadd{display:flex;gap:8px;flex-wrap:wrap}
.logadd select{width:auto !important;flex:none}
.logadd input{flex:1;min-width:180px}
.actions-list{display:flex;flex-direction:column;gap:8px}
.action{display:grid;grid-template-columns:auto minmax(0,1fr) 90px 150px auto;gap:8px;align-items:center}
.action input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand)}
.action input:not([type=checkbox]),.action select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;min-height:36px;width:100%}
.action .linked{font-size:12.5px;color:var(--done);font-weight:700;white-space:nowrap}
.files{display:flex;flex-direction:column;gap:8px}
.file{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.file .fn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fm{font-size:12.5px;color:var(--muted)}
.drop-zone{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted)}
.drop-zone.over{border-color:var(--accent);background:var(--surface-2)}

/* ---------- run meeting ---------- */
.runner{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column}
.runner[hidden]{display:none}
.run-h{background:var(--nav);color:var(--nav-ink);display:flex;align-items:center;gap:16px;padding:14px 24px;flex-wrap:wrap}
.run-h h2{font-size:18px}
.run-h .sub{color:var(--nav-muted);font-size:13.5px}
.timer{font-family:'Montserrat',Arial,sans-serif;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;margin-left:auto}
.timer.over{color:#FF9A3D}
.run-b{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px;padding:20px 24px;max-width:1400px;width:100%;margin:0 auto}
.agenda-list{display:flex;flex-direction:column;gap:6px}
.agenda-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.agenda-item:first-child{border-top:0}
.agenda-item input{width:18px;height:18px;margin-top:2px;accent-color:var(--brand)}
.agenda-item.done span{text-decoration:line-through;color:var(--muted)}
.runner textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;min-height:260px;resize:vertical;line-height:1.55}
.run-h .btn-ghost{color:var(--nav-ink);border-color:rgba(255,255,255,.28)}
.run-h .btn-ghost:hover{background:rgba(255,255,255,.08)}
.run-b>.card{align-self:start}

/* ---------- misc ---------- */
.gate{position:fixed;inset:0;background:var(--nav);display:grid;place-items:center;z-index:60;padding:24px}
.gate[hidden]{display:none}
.gate-card{background:var(--surface);color:var(--ink);border-radius:18px;padding:28px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.gate-card p{margin:0;color:var(--muted)}
.gate-card input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:70;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.notice{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px;color:var(--muted);text-align:center}
.notice b{color:var(--ink)}
.muted{color:var(--muted)}
.mobilebar{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width: 1060px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid2.even{grid-template-columns:1fr}
  .run-b{grid-template-columns:1fr}
}
@media (max-width: 860px){
  .app{grid-template-columns:1fr;background:none}
  .row{grid-template-columns:auto minmax(0,1fr)}
  .row .r{grid-column:2}
  .nav{display:none}
  .page{padding:20px 16px 110px}
  .pagehead h1{font-size:22px}
  .mobilebar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--nav);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
  .mobilebar button{border:0;background:transparent;color:var(--nav-muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;padding:6px 0}
  .mobilebar button[aria-current="page"]{color:#fff}
  .mobilebar button[aria-current="page"] .ic{color:#FF7A00}
  .dlg-b{grid-template-columns:1fr}
  .search{min-width:0;flex:1 1 100%}
  .trow{grid-template-columns:auto minmax(0,1fr) auto}
  .trow .meta .hide-sm{display:none}
  .action{grid-template-columns:auto minmax(0,1fr);}
  .action .wide-only{grid-column:2}
  .frow{grid-template-columns:90px minmax(0,1fr) 90px}
  .sseg.six{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }

<body>
<div class="app">
  <nav class="nav" aria-label="Main">
    <div class="brand"><div class="mark" aria-hidden="true">NoQ</div><div><b>No Q</b><span>Team workspace</span></div></div>
    <div id="navlist" style="display:flex;flex-direction:column;gap:4px"></div>
    <div class="navfoot"><span id="whoami"></span><span id="sync" aria-live="polite"></span></div>

  <main class="main"><div class="page" id="page"></div></main>
</div>
<nav class="mobilebar" id="mobilebar" aria-label="Main"></nav>

<dialog id="dlg"></dialog>
<div class="runner" id="runner" hidden></div>

<div class="gate" id="gate" hidden>

    <h2>Team passcode</h2>

    <input id="gateInput" type="password" autocomplete="current-password" aria-label="Passcode" required>
    <button class="btn btn-primary" type="submit">Open workspace</button>
    <p id="gateErr" role="alert"></p>
  </form>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ======================================================================
   PASTE YOUR GOOGLE WEB APP LINK BETWEEN THE QUOTES BELOW.
   It's the "Web app URL" from Apps Script > Deploy > Manage deployments,
   and it ends in /exec
   (Leave it as it is if this page is served by Apps Script itself.)
   ====================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbz3u5caj7ATFCPdhXJZ6H0IfoZpSapPXI-OvsPp5k0Zg5g-VGTSegnPso0AJ9KktKum/exec";

(function () {
  "use strict";

  /* ================= constants ================= */
  const STATUSES = [
    { id: "doing", label: "In progress", color: "var(--doing)" },
    { id: "wait", label: "Waiting", long: "Waiting on others", color: "var(--wait)" },
    { id: "todo", label: "To do", color: "var(--todo)" },
    { id: "done", label: "Done", color: "var(--done)" }
  ];
  const ST = Object.fromEntries(STATUSES.map(s => [s.id, s]));
  const BOARD_ORDER = ["todo", "doing", "wait", "done"];
  const STAGES = [
    { id: "lead", label: "Lead", p: 10, color: "#A99BC9" },
    { id: "qualified", label: "Qualified", p: 25, color: "#8B5CF6" },
    { id: "proposal", label: "Proposal", p: 50, color: "#6D28D9" },
    { id: "negotiation", label: "Negotiation", p: 75, color: "#4A0C8B" },
    { id: "won", label: "Won", p: 100, color: "#1F8A57" },

  const SG = Object.fromEntries(STAGES.map(s => [s.id, s]));
  const OPEN_STAGES = ["lead", "qualified", "proposal", "negotiation"];
  const DEAL_TYPES = ["Funding", "Car wash partner", "Partnership", "Sponsorship", "Customer", "Other"];
  const DEPTS = ["Leadership", "Technical", "Monitoring & evaluation", "Finance", "Marketing", "Other"];
  // Roles from the AO Solvers NO Q Business Plan (Rev B), section 3 and the organogram
  const ROLE_CATALOG = [
    { role: "Managing Director", dept: "Leadership", seats: 1, desc: "Provides strategic leadership, oversees business performance, partnerships, growth and overall implementation of the company’s strategy." },
    { role: "Technical Lead", dept: "Technical", seats: 1, desc: "Manages day-to-day operations, service delivery, operational systems, scooter operations and implementation of the expansion plan." },
    { role: "Software Lead", dept: "Technical", seats: 1, desc: "Leads software development, maintenance, system architecture, platform improvements, integrations and technical support." },

  const WS_COLORS = ["#4A0C8B", "#6D28D9", "#B4508C", "#C42B2B", "#FF7A00", "#D4A017", "#1F8A57", "#0E8C8C", "#2B7BD6", "#6B7A99", "#8C80A6", "#1A0B33"];

    plus: ["M12 5v14M5 12h14"],
    x: ["M18 6 6 18M6 6l12 12"],
    chev: ["M6 9l6 6 6-6"],
    play: ["M7 4l13 8-13 8z"],
    file: ["M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z", "M14 2v6h6"],
    download: ["M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4", "M7 10l5 5 5-5", "M12 15V3"],
    upload: ["M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4", "M17 8l-5-5-5 5", "M12 3v12"],
    trash: ["M3 6h18", "M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6", "M10 11v6M14 11v6", "M9 6V4h6v2"],

    pin: ["M12 22s7-7.5 7-13a7 7 0 0 0-14 0c0 5.5 7 13 7 13z", "M12 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"],

    ext: ["M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6", "M15 3h6v6", "M10 14 21 3"],
    edit: ["M12 20h9", "M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"]
  };

  /* ================= helpers ================= */
  const $ = s => document.querySelector(s);
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k === "html") n.innerHTML = v;
      else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
      else if (k === "value") n.value = v;
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
    return n;
  }
  function icon(name, cls) {
    const ns = "http://www.w3.org/2000/svg";
    const s = document.createElementNS(ns, "svg");
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "ic" + (cls ? " " + cls : "")); s.setAttribute("aria-hidden", "true");

    return s;
  }
  const uid = () => Math.random().toString(36).slice(2, 10);
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

  // money
  function money(n) { return "R" + Math.round(Number(n) || 0).toLocaleString("en-ZA"); }
  function moneyShort(n) {
    n = Number(n) || 0;
    if (n >= 1e6) return "R" + (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "m";
    if (n >= 1e4) return "R" + Math.round(n / 1e3) + "k";
    return money(n);
  }

  // dates
  const now = () => new Date();
  function iso(d) { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }
  function parseISO(s) { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  function mondayOf(d) { const x = new Date(d); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); x.setHours(0, 0, 0, 0); return iso(x); }
  const thisWeek = () => mondayOf(now());
  function todayKey() { const i = (now().getDay() + 6) % 7; return i < 6 ? DAYS[i][0] : null; }
  function daysUntil(s) { const d = parseISO(s); if (!d) return null; const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((d - t) / 86400000); }
  const fmtDay = s => { const d = parseISO(s); return d ? d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : ""; };
  const fmtDateLong = s => { const d = parseISO(s); return d ? d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }) : ""; };
  function dueInfo(s) {
    const n = daysUntil(s); if (n == null) return null;
    if (n < 0) return { text: "Overdue · " + fmtDay(s), cls: "late" };
    if (n === 0) return { text: "Due today", cls: "late" };
    if (n === 1) return { text: "Due tomorrow", cls: "soon" };
    if (n <= 7) return { text: "Due " + fmtDay(s), cls: "soon" };
    return { text: "Due " + fmtDay(s), cls: "" };
  }
  function ago(isoStr) {
    if (!isoStr) return "";
    const s = (Date.now() - new Date(isoStr).getTime()) / 1000;
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    const d = Math.floor(s / 86400);
    if (d < 7) return d === 1 ? "yesterday" : d + " days ago";
    return new Date(isoStr).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  }
  function meetingStart(m) { const d = parseISO(m.date); if (!d) return null; const [h, mi] = (m.time || "09:00").split(":").map(Number); d.setHours(h || 0, mi || 0, 0, 0); return d; }
  function meetingEnd(m) { const s = meetingStart(m); return s ? new Date(s.getTime() + (Number(m.duration) || 60) * 60000) : null; }
  const hhmm = d => d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false });
  function meetingPhase(m) {
    if (m.status === "cancelled") return "cancelled";
    if (m.status === "held") return "past";

  /* ================= state ================= */
  const state = {
    data: { tasks: [], team: [], workstreams: [], meetings: [], deals: [] },
    loaded: false, failed: false, code: lsGet("noq.code", ""), me: lsGet("noq.me", ""),

  const meetings = () => D().meetings || [];
  const deals = () => D().deals || [];
  const member = id => team().find(p => p.id === id);
  const shortName = id => { const p = member(id); return p ? (p.short || (p.name || "").split(" ")[0] || id) : id; };

  /* ================= server ================= */
  const API_READY = /^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL.trim());
  const IN_APPS_SCRIPT = !!(window.google && google.script && google.script.run);
  async function api(action, ...args) {
    if (API_READY) {
      const res = await fetch(API_URL.trim(), {
        method: "POST", redirect: "follow", credentials: "omit",
        headers: { "Content-Type": "text/plain;charset=utf-8" },

      if (!out.ok) throw new Error(out.error || "SERVER_ERROR");

    }

      return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(action, state.code, args));

  }
  let lastSync = null;
  function apply(st) {

  let refreshing = false;
  async function refresh() {
    if (refreshing) return; refreshing = true;
    try { apply(await api("getState")); }
    catch (e) {
      const m = errText(e);

  const errText = e => String((e && e.message) || e || "");
  const ERRORS = {
    NOT_FOUND: "That item was deleted by someone else.", BUSY: "Lots of changes at once. Try again in a moment.",
    INITIALS_TAKEN: "Those initials are already used by someone on the team.", INITIALS_REQUIRED: "Add initials for this person.",

    FILE_TYPE: "Only PDF and Word (.docx or .doc) files can be added.", FILE_TOO_BIG: "That file is over 10 MB.", EMPTY_FILE: "That file is empty.",
    CANNOT_DELETE_OTHER: "“Other” can’t be deleted; it holds tasks from deleted workstreams.", EMPTY_UPDATE: "Write something first."
  };
  function failed(e) {
    const m = errText(e);

    const key = Object.keys(ERRORS).find(k => m.includes(k));

    const phone = inp("tel", p ? p.phone : "", { placeholder: "e.g. 082 000 0000" });
    const syncRole = () => {
      custom.style.display = role.value === "__custom" ? "" : "none";
      const c = ROLE_CATALOG.find(x => x.role === role.value) || catalogFor(custom.value);
      desc.textContent = c ? c.desc : "";
      if (c && role.value !== "__custom") dept.value = c.dept;
    };
    role.addEventListener("change", () => { syncRole(); if (role.value === "__custom") custom.focus(); });
    custom.addEventListener("input", () => { const c = catalogFor(custom.value); desc.textContent = c ? c.desc : ""; });
    syncRole();
    const body = el("div", { class: "dlg-b" },
      fld("Initials", initials, { hint: p ? "Initials identify this person on tasks and can’t be changed." : "2 to 4 letters, shown on tasks and meetings." }), fld("Status", status),
      fld("Full name", name), fld("Preferred name", short),
      el("div", { class: "field full" }, el("label", { text: "Role" }), role, custom, desc),
      fld("Department", dept), el("div"),
      fld("Email", email), fld("Phone", phone));
    const saveBtn = btn(p ? "Save" : "Add to team", "btn-primary", async () => {
      const ini = initials.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (!p && ini.length < 2) { initials.focus(); toast("Add 2 to 4 initials."); return; }
      if (!name.value.trim()) { name.focus(); toast("Add the person’s name."); return; }
      const roleVal = role.value === "__custom" ? custom.value.trim() : role.value;
      saveBtn.disabled = true;
      try {
        await save("team", p ? p.id : "", Object.assign(p ? {} : { id: ini }, { name: name.value.trim(), short: short.value.trim(), role: roleVal, department: dept.value, status: status.value, email: email.value.trim(), phone: phone.value.trim() }),
          p ? "Saved" : name.value.trim().split(" ")[0] + " added to the team");
        dlg.close();
      } catch (e) {} finally { saveBtn.disabled = false; }
    });
    openDialog({ title: p ? (p.name || p.id) : "Add a person", body, footer: [
      p ? btn("Remove", "btn-danger", async () => { if (confirm("Remove " + (p.name || p.id) + " from the team? Their initials stay on existing tasks.")) { dlg.close(); await removeRec("team", p.id, "Removed from the team"); } }) : null,
      el("span", { class: "grow" }), btn("Cancel", "btn-ghost", () => dlg.close()), saveBtn] });
    setTimeout(() => (p ? name : initials).focus(), 30);
  }

  /* ================= SETTINGS ================= */
  function viewSettings(page) {
    page.append(pageHead("Settings", "Workstreams and this device"));
    const ws = wsList();
    const rows = ws.map(w => {
      const n = tasks().filter(t => (t.workstream || "Other") === w.name).length;
      const openN = tasks().filter(t => (t.workstream || "Other") === w.name && t.status !== "done").length;
      return el("div", { class: "wsedit" },
        el("span", { class: "swatch", style: "background:" + w.color }),
        el("span", {}, el("div", { style: "font-weight:600", text: w.name }), el("div", { class: "muted", style: "font-size:13px", text: n ? openN + " open of " + n + " tasks" : "No tasks yet" })),
        w.id ? btn("Edit", "btn-ghost btn-sm", () => openWorkstream(w)) : el("span"),
        w.id && w.name !== "Other" ? el("button", { class: "iconbtn", type: "button", "aria-label": "Delete " + w.name, onclick: async () => {
          if (!confirm("Delete the “" + w.name + "” workstream?" + (n ? " Its " + n + " task" + (n > 1 ? "s" : "") + " will move to “Other”." : ""))) return;
          await removeRec("workstreams", w.id, "Workstream deleted"); } }, icon("trash")) : el("span"));
    });
    const me = sel([["", "Not set"]].concat(team().map(p => [p.id, (p.name || p.id) + " (" + p.id + ")"])), state.me);
    me.addEventListener("change", () => { state.me = me.value; lsSet("noq.me", me.value); render(); toast("Saved for this device"); });
    page.append(el("div", { class: "grid2" },
      card("Workstreams", ws.length, el("div", {}, el("div", { class: "rows" }, rows), el("div", { style: "margin-top:12px" }, btn("Add workstream", "btn-soft", () => openWorkstream(null), "plus")))),
      el("div", { class: "stack" },
        card("This device", null, el("div", { class: "dlg-b", style: "padding:0;grid-template-columns:1fr" },
          fld("Who’s using this device?", me, { hint: "Used for greetings and as the default name on updates and new meetings." }),
          el("div", {}, btn("Forget passcode on this device", "btn-ghost btn-sm", () => { lsSet("noq.code", ""); location.reload(); })))),
        card("About your data", null, el("div", { class: "muted", style: "font-size:14px;display:flex;flex-direction:column;gap:8px" },
          el("span", { text: "Everything is saved in the team’s Google Sheet, one tab each for Tasks, Meetings, Pipeline, Team and Workstreams." }),
          el("span", { text: "Meeting files are kept in a “No Q Tracker Files” folder in the sheet owner’s Google Drive and are only shown to people with the passcode." }),
          el("span", { text: lastSync ? "Last synced at " + hhmm(lastSync) + ". Changes from other devices appear within about 20 seconds." : "" }))))));
  }
  function openWorkstream(w) {
    const name = inp("text", w ? w.name : "", { placeholder: "e.g. Partnerships" });
    let color = w ? w.color : WS_COLORS.find(c => !wsList().some(x => x.color === c)) || WS_COLORS[0];
    const colors = el("div", { class: "colors", role: "group", "aria-label": "Colour" });
    const draw = () => colors.replaceChildren(...WS_COLORS.map(c => el("button", { type: "button", "aria-pressed": String(c === color), "aria-label": "Colour " + c, style: "background:" + c, onclick: () => { color = c; draw(); } })));
    draw();
    const saveBtn = btn(w ? "Save" : "Add workstream", "btn-primary", async () => {
      if (!name.value.trim()) { name.focus(); toast("Name the workstream."); return; }
      if (w && w.name === "Other" && name.value.trim() !== "Other") { toast("“Other” can’t be renamed, but you can change its colour."); return; }
      saveBtn.disabled = true;
      try { await save("workstreams", w ? w.id : "", { name: name.value.trim(), color }, w ? "Workstream saved" : "Workstream added"); dlg.close(); } catch (e) {} finally { saveBtn.disabled = false; }
    });
    openDialog({ title: w ? "Edit workstream" : "New workstream", body: el("div", { class: "dlg-b", style: "grid-template-columns:1fr" },
      fld("Name", name, { hint: w ? "Renaming updates every task and meeting in this workstream." : "" }), fld("Colour", colors)),
      footer: [el("span", { class: "grow" }), btn("Cancel", "btn-ghost", () => dlg.close()), saveBtn] });
    setTimeout(() => name.focus(), 30);
  }

  /* ================= boot ================= */
  function showGate(msg) { $("#gate").hidden = false; $("#gateErr").textContent = msg || ""; setTimeout(() => $("#gateInput").focus(), 30); }
  $("#gateForm").addEventListener("submit", e => {
    e.preventDefault();
    state.code = $("#gateInput").value.trim(); lsSet("noq.code", state.code);
    $("#gate").hidden = true; $("#gateErr").textContent = "";
    refresh();
  });
  const hashRoute = IN_APPS_SCRIPT ? "" : location.hash.slice(1);
  state.route = ROUTES.some(r => r.id === hashRoute) ? hashRoute : lsGet("noq.route", "home");
  if (!ROUTES.some(r => r.id === state.route)) state.route = "home";
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h !== state.route && ROUTES.some(r => r.id === h)) { state.route = h; render(); } });
  render();
  refresh();
  const busy = () => dlg.open || !$("#runner").hidden;
  setInterval(() => { if (document.visibilityState === "visible" && !busy()) refresh(); }, 20000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !busy()) refresh(); });
  setInterval(() => { if (state.loaded && !busy() && state.route === "home") render(); }, 60000);
})();

</script>
</body>
</html>
